<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#141414"/>
  <!-- Stylised gavel: handle -->
  <rect x="7" y="20" width="13" height="3" rx="1.5" fill="#f5f5f5" transform="rotate(-45 13.5 21.5)"/>
  <!-- Gavel head -->
  <rect x="16" y="7" width="10" height="6" rx="2" fill="#f5f5f5" transform="rotate(-45 21 10)"/>
  <!-- Small accent line -->
  <rect x="17.5" y="8.5" width="10" height="2.5" rx="1.2" fill="#141414" opacity="0.5" transform="rotate(-45 22.5 9.75)"/>
</svg>
